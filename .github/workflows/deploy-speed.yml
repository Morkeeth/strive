name: Deployed Feed speed
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-speed-history
  cancel-in-progress: false
jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install timing runner
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Restore latest retained history snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          done=subprocess.run(['gh','api',f'repos/{repo}/actions/workflows/deploy-speed.yml/runs?status=completed&per_page=30'],check=True,text=True,capture_output=True)
          runs=json.loads(done.stdout)['workflow_runs']
          for run in runs:
              artifacts=json.loads(subprocess.run(['gh','api',f"repos/{repo}/actions/runs/{run['id']}/artifacts"],check=True,text=True,capture_output=True).stdout)['artifacts']
              if any(a['name']=='strive-speed-history' and not a['expired'] for a in artifacts):
                  subprocess.run(['gh','run','download',str(run['id']),'--repo',repo,'--name','strive-speed-history','--dir','previous'],check=True)
                  break
          PY
      - name: Measure deployed SHA, desktop and throttled phone
        env:
          EVENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
        run: |
          expected="$EVENT_SHA"
          if [ -z "$expected" ]; then expected="$(git rev-parse HEAD)"; fi
          python3 scripts/check-deploy-speed.py --sha "$expected" --out speed-results --previous previous/history.json
      - name: Preserve measurement and rolling history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strive-speed-history
          path: speed-results/
          retention-days: 90
          if-no-files-found: error
      - name: Show result
        if: always()
        run: |
          if [ -f speed-results/measurement.json ]; then
            echo '### Deployed Feed speed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Public, signed-out Feed. Three cold samples per profile; medians in milliseconds.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat speed-results/measurement.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
