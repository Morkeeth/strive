name: Contributor checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/dev.py setup
      - run: python3 scripts/dev.py check
      - run: npm ci --ignore-scripts
      - run: npm run test:shared-schema
      - run: npm run test:dropin
      - run: npm run test:identity
      - run: npm run test:people
      - run: npm run test:sunday
      - run: node scripts/test-runtime-config.mjs
      - run: npm run build
      - run: node scripts/test-people-identity.mjs
      - run: npm run test:launch
