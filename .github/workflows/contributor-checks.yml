name: Contributor checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/dev.py setup
      - run: python3 scripts/dev.py check
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every Python test, unchanged; only failures outside docs/testing/failure-triage-20261012.jsonl fail.
      - run: .venv/bin/python scripts/check-python-suite.py
      # Every offline scripts/test-*.mjs; the same rule with docs/testing/node-failure-triage-20261012.jsonl.
      - run: npm run test:all
      - run: npm run test:journey
  python-floor:
    # pyproject promises Python 3.9, and the plugin runs under macOS's system python3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install .
      - run: python -m compileall -q agentgrinder plugins/strive/runtime/agentgrinder
      - run: strive sessions --help
      - run: echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | strive mcp
      - run: strive grind samples/sample_session.jsonl --harness claude --push --no-series
      - run: python plugins/strive/scripts/strive.py --state "$RUNNER_TEMP/strive" doctor
