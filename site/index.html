     address people actually post showed as a bare link. The image is the same @vercel/og
     pipeline as /r/<id> (api/og.js), and __ORIGIN__ is replaced at build time because a crawler
     will not resolve a relative image. -->

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
<style>
/* AGENT GRINDER - one family (IBM Plex Sans 400/500/600), five sizes (11 13 14 20 28),
   one accent (#0047ff) where it carries meaning, hairlines, square corners, no shadows,
   no gradients, no monospace. docs/design/REFERENCE-2026-09-03.html is the law. */

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
@media(min-width:701px){html{overflow-y:scroll}}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;font-weight:400;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;color:var(--dim);font-weight:400;display:block}
.meta,.hint{font-size:13px;color:var(--soft);font-weight:400}

/* buttons - only an action may look like one */
button{font-family:inherit;font-size:13px;font-weight:500;line-height:1;border-radius:2px;
  padding:8px 14px;cursor:pointer;background:var(--ink);color:#fff;border:1px solid var(--ink)}
button:hover{background:#000;border-color:#000}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.ghost,.act{background:none;color:var(--ink);border:1px solid var(--rule)}
button.ghost:hover,.act:hover{background:var(--rule-2);border-color:var(--rule)}
.act{font-family:inherit;font-size:13px;font-weight:500;line-height:1;border-radius:2px;padding:7px 12px;cursor:pointer}
.act.blue{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-wash)}
.act.blue:hover{background:#e9efff}
.act.on{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-wash)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1320px;margin:0 auto;padding:0 24px;height:54px;display:flex;align-items:center;gap:26px}
.mark{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.mark i{color:var(--blue);font-style:normal}
.alpha-label{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border:1px solid var(--rule);color:var(--soft);font-size:11px;font-weight:500;white-space:nowrap}
.bar nav{display:flex;gap:20px;font-size:13px;color:var(--soft);min-width:0;overflow:visible;align-items:center;flex-wrap:wrap}
.bar nav a{white-space:nowrap}
.bar nav a.on,[aria-current=page]{color:var(--ink);font-weight:500}
.run-outcome{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.run-outcome .run-story-label{margin:0 0 6px}
.run-outcome-repo{margin:0;font-size:13px}
.run-outcome-shipped{margin:6px 0;padding-left:18px;font-size:13px}
.run-outcome-links{margin:6px 0 0;font-size:13px}
.run-outcome-image img{max-width:100%;border-radius:6px;margin-top:8px}
.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:4px;border-radius:999px;background:var(--blue, #123cff);color:#fff;font-size:10px;line-height:1;vertical-align:middle}
.nav-badge[hidden]{display:none}
.account-menu{position:relative}
.account-menu>summary{list-style:none;cursor:pointer;color:var(--soft);font-size:13px;display:flex;align-items:center;justify-content:center;min-width:36px;min-height:36px}
.account-menu>summary::-webkit-details-marker{display:none}
.account-menu[open]>summary,.account-menu>summary:hover{color:var(--ink)}
.account-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:180px;background:var(--card, var(--bg));border:1px solid var(--line, var(--rule));padding:8px;z-index:40;display:grid;gap:4px}
.account-panel a,.account-panel button{display:block;width:100%;padding:8px 10px;color:var(--ink);text-decoration:none;text-align:left;background:none;border:0;font-weight:400}
.account-panel a:hover,.account-panel button:hover{background:var(--rule-2);border:0}
.icon-button{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;background:none;color:var(--ink);border:1px solid transparent;position:relative}
.icon-button:hover{background:var(--rule-2);border-color:var(--rule)}
.icon-button svg{width:19px;height:19px}
.profile-trigger{padding:0;border:0;background:none;color:var(--ink)}
.profile-trigger:hover{background:none;border:0}
.profile-trigger img,.profile-trigger .profile-fallback{width:30px;height:30px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11px;font-weight:600}
.feed-tabs,.section-tabs{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 18px;font-size:14px}
.feed-tabs a,.section-tabs a{color:var(--soft);text-decoration:none}
.feed-tabs a.on,.section-tabs a.on,[aria-current=page].tab{color:var(--ink);font-weight:600}
.community-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.community-grid a{display:block;padding:18px;border:1px solid var(--line, var(--rule));text-decoration:none;color:inherit;overflow-wrap:anywhere}
.discovery-sources{margin:0 0 22px}.discovery-sources .community-grid a{background:var(--box)}.discovery-sources h2{font-size:14px;margin:0}.discovery-sources .hint{margin:4px 0 10px}
#i_pub{min-width:160px}
.discover-intro{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px;flex-wrap:wrap}.discover-intro h2{font-size:20px;margin:0}.discover-intro .hint{margin:6px 0 0}
.discovery-sources{margin:24px 0;border-top:1px solid var(--rule);padding:16px 0}.discovery-sources>summary{cursor:pointer;font-size:14px;font-weight:500;min-height:28px}.discovery-links{display:grid;gap:0}.discovery-links a{padding:12px 0;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.discovery-links span{font-size:12px;color:var(--soft)}
@media(max-width:700px){.community-grid{grid-template-columns:1fr}}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);white-space:nowrap}
.bar .right .you{color:var(--ink);font-weight:500}
.bar .right button{padding:7px 12px}
.bar .right>.icon-button,.bar .right>.account-menu>summary{box-sizing:border-box;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;flex:0 0 44px;display:grid;place-items:center}
.bar .right>.account-menu{flex:0 0 44px;width:44px}
.bar .right>.icon-button .nav-badge{position:absolute;right:0;top:0;margin:0}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding:0 24px;display:grid;
  grid-template-columns:172px minmax(0,1fr) 276px;align-items:start}
.rail{border-right:1px solid var(--rule);padding:24px 22px 60px 0;position:sticky;top:54px}
.rail .lbl{margin:20px 0 8px}
.rail .lbl:first-child{margin-top:0}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:5px 0;color:var(--soft);font-size:13px}
.rail a.on{color:var(--ink);font-weight:500}
.rail a span{color:var(--dim)}
.rail .rail-post{margin:0 0 20px;padding:10px 12px;background:var(--blue);border:1px solid var(--blue);color:#fff;justify-content:center;font-weight:500;transition:transform .16s ease,background .16s ease}
.rail .rail-post:hover{color:#fff;background:#003de0;transform:translateY(-1px)}
.rail-main{display:grid;gap:3px}
.rail-main a{padding:9px 10px;margin-left:-10px;border-left:2px solid transparent}
.rail-main a.on{border-left-color:var(--blue);background:var(--blue-wash);color:var(--ink)}
.main{padding:24px 24px 90px;border-right:1px solid var(--rule);min-width:0}
.side{padding:24px 0 90px 22px;position:sticky;top:54px}
.shell.norail{grid-template-columns:minmax(0,1fr) 276px}
.shell.norail .rail{display:none}
.shell.norail .main{padding-left:0}
.shell.noside{grid-template-columns:172px minmax(0,1fr)}
.shell.noside .side{display:none}
.shell.noside .main{border-right:0;padding-right:0}
.shell.norail.noside,.shell.solo{grid-template-columns:minmax(0,1fr)}
.shell.solo .rail,.shell.solo .side{display:none}
.shell.norail.noside .main,.shell.solo .main{border-right:0;padding:24px 0 90px;max-width:760px;margin:0 auto}
.shell.wide.norail.noside .main,.shell.wide.solo .main,.shell.wide .main{max-width:1240px}
.rail .r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;color:var(--soft);font-size:13px}
.rail .r span{color:var(--dim)}

#status{max-width:1320px;margin:0 auto;padding:10px 24px 0;color:var(--soft);font-size:13px}
#status.err{color:var(--ink);font-weight:500}

/* section heads */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 12px}
.head h2{font-size:14px;font-weight:600;margin:0}
h2.sec{font-size:14px;font-weight:600;margin:28px 0 12px;padding:0}
h2.sec:first-child{margin-top:0}
h3{font-size:14px;font-weight:600;margin:0 0 10px}

/* upload - the first thing on the page */
.up{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.up-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.up-top .t{font-size:14px;font-weight:600}
.up-top .meta{margin-left:auto}
.cmd{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule-2)}
.cmd .c{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.5;word-break:break-word}
.cmd .d{font-size:13px;color:var(--soft);flex:none}
.up-foot{padding:11px 16px;font-size:13px;color:var(--soft)}
.cmd .c.plain{font-weight:400;color:var(--soft)}
.cmd a.d{color:var(--blue)}
a.act{display:inline-block;text-decoration:none}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 28px}
.cta .hint{flex-basis:100%;margin-top:2px}

/* the coach, running */
.check{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.check-top{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.check-top .t{font-size:14px;font-weight:500}
.check-top .s{margin-left:auto;font-size:13px;color:var(--soft)}
.step{display:grid;grid-template-columns:14px 122px minmax(0,1fr);gap:12px;align-items:baseline;
  padding:9px 16px;border-bottom:1px solid var(--rule-2);font-size:13px;opacity:.3;
  transition:opacity .28s ease}
.step:last-child{border-bottom:0}
.step.done{opacity:1}
.step .i{width:6px;height:6px;border:1px solid var(--dim);border-radius:50%;transform:translateY(-1px)}
.step.done .i{background:var(--blue);border-color:var(--blue)}
.step .n{font-weight:500}
.step .o{color:var(--soft)}

/* run card */
.card{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.c-top,.runtop{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
/* THE MARK IS THE GRIND. Brand book section 6: the mark is generative, the rhythm of a real
   session drawn as a profile line, so the logo is never a stock glyph. The avatar is that tile:
   a square hairline box holding the account's own newest grind trace. No letter, no image, no
   emoji, no gradient. An account with no run draws a flat line, deliberately empty. */
.av{width:26px;height:26px;border:1px solid var(--rule);display:block;flex:none;
  position:relative;background:var(--box)}
.av svg{display:block;width:100%;height:100%}
.trace{fill:none;stroke:var(--ink);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
/* no run yet: a flat line, the same dash this design already prints for a number nobody
   measured. Your mark appears when you post your first grind. */
.trace.empty{stroke:var(--dim)}
/* an agent account is marked by a rule the design already uses, not a new colour or a badge */
.av.agent::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--ink)}
.who a,.who span{font-size:14px;font-weight:500}
.who small{display:block;font-size:13px;color:var(--dim);font-weight:400}
.who small a{color:var(--dim)}
.state{margin-left:auto;font-size:13px;color:var(--blue);font-weight:500}
.state.off{color:var(--dim);font-weight:400}
.c-title,.title{font-size:14px;font-weight:500;padding:14px 16px 0}
.run-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-right:16px}
.run-title-row .title{min-width:0;flex:1}
.run-owner-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding-top:8px}
.sub{padding:4px 16px 0;font-size:13px;color:var(--soft)}
.card-harness{color:var(--ink);font-weight:500}
.note{padding:8px 16px 0;font-size:14px;line-height:1.55}
.grp{padding:14px 16px 0;font-size:11px;color:var(--dim)}
.para{padding:6px 16px 0;font-size:14px;line-height:1.6}
.plan{margin:6px 16px 0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--soft)}
.rule-line{margin:12px 16px 0;padding-left:12px;border-left:1px solid var(--blue);font-size:13px;line-height:1.55}

/* the headline stat, then the boxed grid */
.hl{display:flex;align-items:baseline;gap:12px;padding:14px 16px 0;cursor:help}
.hl .n{font-size:28px;font-weight:500;line-height:1;color:var(--blue);letter-spacing:-.02em}
.hl .k{font-size:11px;color:var(--dim)}
.boxes,.fiverow{display:grid;grid-template-columns:repeat(5,1fr);background:var(--rule);gap:1px;
  border-top:1px solid var(--rule);margin-top:14px}
.bx,.five{background:var(--box);padding:12px 14px;min-width:0}
.bx .lbl,.five .k{font-size:11px;color:var(--dim);line-height:1.3}
.bx .v,.five .v{font-size:20px;font-weight:500;margin-top:6px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx .v span,.five .v span{font-size:13px;color:var(--soft);font-weight:400}
.bx.hero .v{color:var(--blue)}
.five[data-missing] .v{color:var(--dim);font-weight:400}
.costtag{font-style:normal;color:var(--dim);margin-left:4px}

/* trace */
.tw{padding:12px 16px 0}
.tw svg{display:block;width:100%;height:60px}
.tl{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .tl{stroke-dasharray:3400;stroke-dashoffset:3400;animation:draw 1.1s cubic-bezier(.25,.7,.3,1) .15s forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}
.tl.grey{stroke:#c6c6c1}
.base{stroke:var(--rule-2);stroke-width:1}
.curve{display:block;width:100%;height:60px}

/* card foot */
.c-foot,.foot{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--rule);
  align-items:center;margin-top:14px;font-size:13px;color:var(--soft)}
.c-foot .acts,.foot .acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.run-continuation{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px 0}
.run-continuation .acts{display:flex;flex-wrap:wrap;gap:8px}
.run-primary-actions{border-left:2px solid var(--blue);padding:14px 16px;margin:0 0 24px;background:var(--box)}
.run-primary-actions p{margin:0 0 10px}
.run-primary-actions .cta{margin:0}
.run-primary-actions .hint{margin:10px 0 0}

/* skeleton - one shot, resolves into real content */
.sk{background:linear-gradient(90deg,#eeeeeb 25%,#f6f6f4 37%,#eeeeeb 63%);background-size:400% 100%;
  animation:sh 1.25s ease infinite;border-radius:2px;display:block}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk.l{height:9px;margin:7px 0}
.fade{opacity:0;transition:opacity .3s ease}
.fade.in{opacity:1}

/* side panels */
.panel{border:1px solid var(--rule);background:var(--box);margin-bottom:14px}
.p-top{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
  align-items:baseline;gap:10px}
.p-top .t{font-size:14px;font-weight:600}
.p-row,.flex-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.p-row:last-child,.flex-row:last-child{border-bottom:0}
.p-row .v{color:var(--soft);min-width:0;overflow-wrap:anywhere;text-align:right}
.p-row .v b{color:var(--ink);font-weight:500}
.p-row .v.never{color:var(--ink);font-weight:500}
.g-row{padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px;display:block}
.g-row:last-child{border-bottom:0}
.pad{padding:14px 16px}
.panel .pad h3{margin:0 0 8px}

/* forms */
label{display:block;font-size:11px;color:var(--dim);margin:0 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:13px;background:var(--box);color:var(--ink);
  border:1px solid var(--rule);border-radius:0;padding:9px 11px;margin-bottom:10px}
input[type=checkbox]{width:auto;margin:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
.row{display:flex;gap:10px}.row>*{flex:1}
.empty{color:var(--soft);padding:36px 16px;line-height:1.7;font-size:13px}
footer{max-width:1320px;margin:0 auto;padding:20px 24px 40px;color:var(--dim);font-size:13px;
  border-top:1px solid var(--rule)}

/* Notifications are a return surface, not another destination. */
.notice-drawer{position:fixed;inset:0 0 0 auto;width:min(390px,100vw);z-index:70;background:var(--paper);border-left:1px solid var(--rule);box-shadow:-18px 0 48px rgba(0,0,0,.08);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s ease}
.notice-drawer[aria-hidden="true"]{display:none}
.notice-drawer.open{transform:translateX(0)}
.notice-head{min-height:54px;padding:0 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.notice-head h2{font-size:14px;margin:0}.notice-head .notice-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.notice-body{overflow:auto;padding:10px 14px 24px;overscroll-behavior:contain}
.notice-item{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:13px 2px;border-bottom:1px solid var(--rule-2)}
.notice-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:7px}.notice-item.read .notice-dot{background:transparent;border:1px solid var(--rule)}
.notice-copy{margin:0;font-size:13px;line-height:1.45}.notice-meta{margin:3px 0 7px;color:var(--dim);font-size:11px}.notice-links{display:flex;gap:12px;align-items:center;font-size:12px}.notice-links a{color:var(--blue)}.notice-links button{padding:0;border:0;background:none;color:var(--soft);font-size:12px;min-height:28px}.notice-empty{padding:32px 4px;color:var(--soft)}
.notice-scrim{position:fixed;inset:0;background:rgba(0,0,0,.16);z-index:69;opacity:0;pointer-events:none;transition:opacity .2s ease}.notice-scrim.open{opacity:1;pointer-events:auto}

/* onboarding */
.identity-welcome{padding:0;overflow:hidden}
.identity-intro{padding:24px 24px 18px;background:linear-gradient(135deg,var(--blue-wash),var(--box) 58%);border-bottom:1px solid var(--rule)}
.identity-kicker{margin:0 0 8px;color:var(--blue);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

// with none of those gets no label, so a failed run reads as what it was.
function achievedLabel(r){
  if(typedOnlyRun(r))return '';
  const shipped=Array.isArray(r.shipped)?r.shipped.length:r.shipped?1:0;
  const receipts=Array.isArray(r.receipts)?r.receipts.length:r.receipts?1:0;
  const done=(r.commits>0)||shipped>0||receipts>0||!!(r.output_url&&safeOutputUrl(r.output_url));
  return done?'<div class="run-story-label achieved">Achieved</div>':'';
}
function proofRouteHtml(r){
  const route=r&&r.code_route;
  const stops=route&&route.v===1&&!route.unavailable&&Array.isArray(route.stops)?route.stops.filter(Boolean):[];
  if(stops.length<2)return '';
  const problem=stops.find(s=>s.kind==='check'||s.kind==='fail')||stops[0];
  const change=stops.find(s=>['artifact','merge','change'].includes(s.kind)&&s.id!==problem.id)||stops[1];
  const checked=[...stops].reverse().find(s=>s.basis==='measured'&&(s.kind==='check'||Array.isArray(s.evidence)&&s.evidence.length));
  const result=(route.finish&&route.finish.label)||(Array.isArray(r.shipped)&&r.shipped[0])||null;
  if(!problem?.label||!change?.label||!checked?.label||!result)return '';
  const rows=[['Problem',problem.label],['Change',change.label],['Check',checked.label],['Result',result]];
  return `<div class="run-hero proof-route" aria-label="Proof Route">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(String(v))}</dd></div>`).join('')}</div>`;
}
function resultHeroHtml(r){

  const label=shipped[0]||(output?'Linked output':r.commits>0?`${r.commits} commit${r.commits===1?'':'s'} recorded`:'');
  if(!n||!label)return '';
  return `<div class="run-hero result-hero" aria-label="Result"><div class="result-number num">${esc(n)}</div><p>${esc(label)}</p></div>`;
}

function wireAckPicker(card,r,selected){
  let reason=selected;
  card.querySelectorAll('.ack-chip').forEach(ch=>ch.addEventListener('click',()=>{
    reason=ch.dataset.reason;
    card.querySelectorAll('.ack-chip').forEach(x=>x.classList.toggle('on',x===ch));
    const send=card.querySelector('.ack-send'); if(send) send.disabled=!reason;
  }));
  const cancel=card.querySelector('.ack-cancel');
  if(cancel) cancel.addEventListener('click',()=>{ const p=card.querySelector('.ack-picker'); if(p)p.remove(); });
  const send=card.querySelector('.ack-send');
  if(send) send.addEventListener('click',async()=>{
    if(!reason)return;
    if(await submitAck(r.id,r.profile_id,reason)){
      const p=card.querySelector('.ack-picker'); if(p)p.remove();
      const btn=card.querySelector('.kudo');
      if(btn){btn.classList.add('on','pop'); const n=btn.querySelector('.num'); if(btn.classList.contains('fc-act')&&n) n.textContent=String((Number(n.textContent)||0)+1); else btn.firstChild.textContent='Thanks ';}
      if(location.search.includes('run=')) viewRun(r.id);
    }
  });
}

function harnessLabel(h){

function compareAgents(runs){
  if(!runs||runs.length<2) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0,commits:0};
    by[h].runs++; by[h].prompts+=r.prompts||0;
    by[h].minutes+=Math.round((r.duration_s||0)/60);
    by[h].commits+=r.commits||0;
  });
  const keys=Object.keys(by);
  if(keys.length<2) return '';
  const rows=keys.sort((a,b)=>by[b].runs-by[a].runs).map(h=>{
    const b=by[h];
    return `<div class="p-row"><span style="font-weight:500">${esc(h)}</span><span class="v">${b.runs} runs · ${b.prompts} prompts · ${b.minutes}m · ${b.commits} commits</span></div>`;
  }).join('');
  return `<div class="head"><h2>Flex · across agents</h2><span class="meta">${keys.length} rigs</span></div><div class="panel">${rows}</div>`;
}
function coachLine(runs){
  if(!runs||!runs.length) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0};
    by[h].runs++; by[h].prompts+=r.prompts||0; by[h].minutes+=Math.round((r.duration_s||0)/60);
  });
  const keys=Object.keys(by);
  if(keys.length<2){
    return `<p class="hint" style="margin:0 0 16px">Post from Claude and Cursor to flex across agents: agentgrinder flex, on your machine.</p>`;
  }
  const top=keys.sort((a,b)=>(by[b].prompts/by[b].runs)-(by[a].prompts/by[a].runs))[0];
  const avg=Math.round(by[top].prompts/by[top].runs);
  return `<p class="hint" style="margin:0 0 16px">Your deepest sits: <b style="color:var(--ink);font-weight:500">${esc(top)}</b>, ${avg} prompts per run. Flex the rest: agentgrinder grind --harness auto --push.</p>`;
}

function shareCurveSvg(rhythm,w=420,h=100){
  const r=(rhythm&&rhythm.length)?rhythm:[1],p=6,mx=Math.max(...r)||1,n=r.length;
  const x=i=>p+i*(w-2*p)/Math.max(n-1,1),y=v=>h-p-(v/mx)*(h-2*p);
  const pts=r.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const poly=`${p},${h-p} ${pts} ${w-p},${h-p}`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"><line class="base" x1="0" y1="${h-p}" x2="${w}" y2="${h-p}"/><polyline class="tl" points="${pts}"/></svg>`;
}

function vptTotals(R){
  const full=R.filter(r=>r.claims_verified!=null&&r.artifacts_produced!=null&&r.prompts);
  const num=full.reduce((a,r)=>a+r.claims_verified+r.artifacts_produced,0), den=full.reduce((a,r)=>a+r.prompts,0);
  const x=den?num/den:null;
  return {vpt:x==null?'-':x.toFixed(2), vptVal:x,
    vptFormula:x==null?`needs verified claims + artifacts produced on at least one run (${R.length} runs, none stored with them yet)`:`(${num} verified + artifacts) ÷ ${den} typed turns over ${full.length} of ${R.length} runs`};
}

// The number counts up to the value it already prints. `data-dec` is the decimal count the
// real number carries: without it a 3.67 would land on 3.7 and the card would show a number
// nobody measured.
function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{
  const target=parseFloat(el.getAttribute('data-count')); if(isNaN(target)) return;
  const dec=el.dataset.dec!=null?parseInt(el.dataset.dec):(target%1!==0?1:0);
  if(el.dataset.counted===String(target))return;
  el.dataset.counted=String(target);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toFixed(dec);return;}
  const dur=180, t0=performance.now();
  function step(t){ if(!el.isConnected)return; const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step); }); }
// a whole number gets a count-up; a composite like "3/7 · 43%" or a dash never does.
const cnt=v=>/^\d+$/.test(String(v))?` data-count="${v}"`:'';

function wireAutoSync(root){
  const go=(root||document).querySelector('#auto-sync-go'); if(!go||go.dataset.wired) return; go.dataset.wired='1';
  go.addEventListener('click',async()=>{
    go.disabled=true; const state=$('auto-sync-state'); if(state) state.textContent='Making your private token…';
    try{
      const {data,error}=await sb.rpc('agent_token_create',{p_label:'Automatic sync'});
      if(error) throw error;
      const token=data&&typeof data.token==='string'?data.token:'';
      if(!token) throw new Error('No token came back. Try again.');
      const line=SYNC_LINE(token);
      $('auto-sync-body').innerHTML=`<p><b>Run this once in a terminal on that computer.</b> It is shown once. It uploads the last 7 days of sessions as private runs, then checks every 15 minutes.</p>
        <div class="cmd"><span class="c">${esc(line)}</span><button type="button" class="act" data-copy="${esc(line)}">Copy</button></div>
        <p class="hint">Needs <a href="https://docs.astral.sh/uv/">uv</a>. Stop it any time with <code>agentgrinder sync --uninstall</code>. The token works for 30 days and uploads private runs only; revoke it under <a href="/?connect=auto">Connections</a>.</p>`;
      if(state) state.textContent='';
      wireConnectCopies($('auto-sync-body'));
    }catch(e){ go.disabled=false; if(state) state.textContent=(e&&e.message)||'The token could not be made. Try again.'; }
  });
}

function wireConnectCopies(root){
  (root||document).querySelectorAll('[data-copy]').forEach(b=>{ if(b.dataset.wired) return; b.dataset.wired='1';

}

// The five tools and the three modes, in words, with no account. Named exactly as the code names
// them, so a reader can grep agentgrinder/coach/tools.py and agentgrinder/coach/agent.py.
function howItWorks(){
  const tools=[
    ['read_run','cuts the sitting out of the transcript, counts the typed turns, and lists every claim line and every file the run wrote.'],
    ['check_claim','looks for evidence in the same typed turn as the claim and returns the matching tool result, or says there was none.'],
    ['verify_artifact','asks the disk whether the file exists, how big it is, and whether it was written inside the sitting.'],
    ['git_evidence','asks git which commits inside the sitting carry the file, and the first commit after it that did.'],
    ['write_verdict','writes the paragraph and the next-session plan, and refuses any number no tool in that run returned.']];
  const modes=[
    ['local','the default. A real Strands agent loop over the five tools, driven by a scripted local model. Keyless, no network, no spend.'],
    ['bedrock','opt in. The same loop with a real model on Amazon Bedrock. Needs AWS credentials, costs money, and sends the claim lines off your machine. The command says so before it runs.'],
    ['none','no agent. The five tools called in a fixed order.']];
  const row=(k,v)=>`<div class="g-row"><b style="font-weight:500">${esc(k)}</b>
    <div class="meta" style="margin-top:3px">${esc(v)}</div></div>`;
  return `<div class="head"><h2>How it works</h2><span class="meta">the coach, in words</span></div>
  <div class="panel"><div class="p-top"><span class="t">The five tools the coach calls</span></div>
    ${tools.map(t=>row(t[0],t[1])).join('')}</div>
  <div class="panel"><div class="p-top"><span class="t">Three modes, and the mode is always printed</span></div>
    ${modes.map(m=>row(m[0],m[1])).join('')}
    <div class="g-row meta">A mode that fails does not fall back quietly. The run is marked <b style="color:var(--ink);font-weight:500">DEGRADED</b>, and the screen names the failure, the reason, and the mode it fell back to.</div></div>`;
}

// The command a stranger runs, exactly as they run it. One click copies it.
//
// It used to be `... && pip install -e . && agentgrinder grind --coach`. Measured on a stock Mac
// (3 Sep 2026): `/usr/bin/python3` is 3.9.6 and ships pip 21.2.4, which predates PEP 660 and
// refuses an editable install of a pyproject-only project. The chain died at the third command
// with exit 1, so the first thing anyone did from this page failed. There is no install in the
// line any more, because the package needs none: it runs from the clone on the python macOS
// already has. The coach is a second, honest line - it needs Python 3.10 or newer, and says so.
const INSTALL_CMD="uvx --from __CAPTURE_PACKAGE__ agentgrinder grind --harness auto";
// The first-run door: one line that installs nothing globally and needs no clone. Its --push
// defaults to the hosted app (agentgrinder/push.py), so the printed link opens a real page.
const COACH_CMD='python3.12 -m venv .venv && .venv/bin/pip install -e ".[coach]" && .venv/bin/agentgrinder grind --coach';
// The coach reading the sitting, one tool at a time. Every line is a column of the run row that
// is on screen below it. No line is invented: a part the row does not carry says so in words,
// and the per-tool durations of the mock are not rendered because no column holds them.
function coachStrip(r){
  if(!r) return '';
  const rows=[
    ['read_run', `${r.prompts??'-'} typed turns, ${r.claims??'-'} claim lines`],
    ['check_claim', (r.claims_verified!=null&&r.claims!=null)?`${r.claims_verified} of ${r.claims} claims had evidence in their own turn`:'every claim tested against its own turn'],
    ['verify_artifact', r.artifacts_produced!=null?`${r.artifacts_produced} files the run wrote exist on disk`:'every file tested against the disk'],
    ['git_evidence', r.commits!=null?`${r.commits} commits inside the sitting`:'every file tested against git'],
    ['write_verdict', r.coach_tool_calls?`verdict written, ${r.coach_tool_calls} tool calls`:'verdict written']];
  const dm=r.duration_s?Math.round(r.duration_s/60):0;
  const head=[dm?fmtDur(dm):'',r.harness].filter(Boolean).join(' · ');
  return `<div class="check" id="check">
    <div class="check-top">${avatar(profileHandle(r.profiles),{rhythm:r.rhythm})}
      <span class="t">${esc(head||'a real sitting')}</span><span class="s" id="st">reading</span></div>
    ${rows.map((t,i)=>`<div class="step" data-s="${i}"><span class="i"></span><span class="n">${esc(t[0])}</span><span class="o">${esc(t[1])}</span></div>`).join('')}</div>`;
}
let _stripRun=false;
function playStrip(){
  const steps=[...document.querySelectorAll('#check .step')], st=document.getElementById('st');
  if(!steps.length) return;
  if(_stripRun){ steps.forEach(x=>x.classList.add('done')); if(st) st.textContent=steps[steps.length-1].querySelector('.o').textContent; return; }
  _stripRun=true;
  steps.forEach((x,i)=>setTimeout(()=>{ x.classList.add('done');
    if(st) st.textContent = i===steps.length-1 ? x.querySelector('.o').textContent : x.querySelector('.n').textContent; },320+i*520));
}

// The newest public runs, only Public ones: a Link run never reaches this door.
async function fetchLatestPublicRuns(limit){
  if(!sb) return null;
  try{
    const {data,error}=await sb.from('runs')
      .select('*, profiles!runs_profile_id_fkey(github_handle,name,rig,handle,display_name,avatar_url)')
      .eq('visibility','public')
      .order('created_at',{ascending:false})
      .limit(limit||3);
    if(error) throw error;
    return data||[];
  }catch(_){ return null; } // null: the read failed, which is not the same as no runs
}

// A stranger lands on what is going on, then people, then runs. Real rows only (site/home.js).
async function viewLanding(){
  const app=$('app');
  frame(railHtml('feed'),null);
  setPrimarySection('feed');
  app.innerHTML=feedTabs('following')+landingHTML();
  const H=window.GrinderHome, now=Date.now();
  const data=H&&sb?await H.read(sb,now):{runs:null,clubs:null,events:null};
  const put=(id,html)=>{const el=$(id);if(el)el.innerHTML=html};
  // A failed read says it failed; only a read that worked may say there is nothing.
  const failed='<p class="home-none" data-failed>This section could not load. Refresh to try again.</p>';
  put('home-week',data.runs===null&&data.events===null?failed:H.weekHtml(data.runs,data.events,now));
  put('home-events',data.events===null?failed:data.events.length?`<div class="evs">${data.events.slice(0,3).map(H.eventRow).join('')}</div>`:'');
  put('home-clubs',data.clubs===null?failed:data.clubs.length?`<div class="clubs">${data.clubs.slice(0,6).map(H.clubRow).join('')}</div>`:'');
  if(data.clubs!==null&&!data.clubs.length)$('home-clubs-section')?.setAttribute('hidden','');
  if(data.runs!==null&&!data.runs.length&&data.events!==null&&!data.events.length)$('home-week-section')?.setAttribute('hidden','');
  const who=data.runs?H.builders(data.runs,6):[];
  put('home-builders',data.runs===null?failed:who.length?who.map(b=>GrinderFeed.builderRow(b.run)).join(''):'<p class="home-none">No builder has posted a public run in the last 30 days.</p>');
  const body=$('landing-feature-body');
  let runs=data.runs||[], runsFailed=data.runs===null;
  if(!runs.length){const older=await fetchLatestPublicRuns(5);if(older===null)runsFailed=true;else{runs=older;runsFailed=false}}
  if(runs.length){
    noteTraces(runs);
    const ad=await ackData(runs);
    const top=H?H.popular(runs,ad.counts,5):runs.slice(0,5);
    if(body) body.innerHTML=feedCards(top,ad);
  }else if(body){
    body.innerHTML=runsFailed?failed:'<p class="home-none">No public run yet.</p>';
  }
  wireKudos();
  if(ME||location.search||location.hash) return;
  const line=$('public-run-count');
  if(!line) return;
  const count=await fetchPublicRunCount();
  line.textContent=count===0?'No public runs yet. Yours would be the first.'
    :count===1?'1 public run is live.'
    :Number.isInteger(count)?`${count} public runs are live.`:'';
  line.dataset.countState=Number.isInteger(count)?'ready':'unavailable';
}

// run-contract.js safeUrl (12 to 300 characters, https, no spaces, quotes, brackets or backslashes),
// plus the raster ending the card needs to show it.
function isRunPhotoUrl(u){
  if(typeof u!=='string'||u.length<12||u.length>300||/[\s<>"'\\]/.test(u)||/javascript:/i.test(u)) return false;
  try{if(new URL(u).protocol!=='https:') return false}catch(_){return false}
  return /\.(png|jpe?g|webp)([?#].*)?$/i.test(u);
}

function wireComposer(){
  const pb=$('publish'); if(!pb)return;
  const fields=['f_title','f_project','f_repo','f_model','f_segment','f_wall','f_caption','f_output_url','f_prompts','f_dur','f_commits','f_vis'];
  const key='ag_manual_post_draft';
  let attemptId=crypto.randomUUID();
  try{
    const saved=JSON.parse(sessionStorage.getItem(key)||'null');
    if(saved?.profileId===ME?.id&&typeof saved.id==='string'){
      attemptId=saved.id;
      for(const id of fields)if(typeof saved[id]==='string')$(id).value=saved[id];
    }
  }catch(_){}
  function keepDraft(){try{sessionStorage.setItem(key,JSON.stringify({id:attemptId,profileId:ME?.id,...Object.fromEntries(fields.map(id=>[id,$(id).value]))}))}catch(_){}}
  function clearDraft(){try{sessionStorage.removeItem(key)}catch(_){}}
  fields.forEach(id=>$(id)?.addEventListener('input',keepDraft));
  pb.addEventListener('click',async()=>{ if(!ME)return;
    const title=$('f_title').value.trim(),caption=$('f_caption').value.trim(),audience=$('f_vis').value,output=$('f_output_url').value.trim();
    const wallTime=optionalWholeNumber('f_wall');
    if(!title||!caption||!audience){status('Add a title and caption, then choose who can see the run.',true);return}
    if(Number.isNaN(wallTime)){status('Segment wall time must be a whole number of seconds.',true);return}
    if(output&&!safeOutputUrl(output)){status('The output link must start with http:// or https://.',true);return}
    if(!(await requireCloseFriendsForSave(audience)))return;
    keepDraft();
    pb.disabled=true;
    const recover=$('manual-recover');recover.hidden=true;recover.innerHTML='';
    const openExisting=async prior=>{
      clearDraft();
      history.replaceState(null,'','/?run='+prior.id);
      status('This save was already received as '+(prior.visibility==='private'?'Only me':prior.visibility==='link'?'Followers':'Public')+'. Opening the existing run; no duplicate was created.');
      await viewRun(prior.id);
    };
    const existing=async()=>{
      const {data,error}=await sb.from('runs').select('id,visibility').eq('id',attemptId).eq('profile_id',ME.id).limit(1);
      if(error)throw error;
      return data?.[0]||null;
    };
    const showRecovery=error=>{
      const message=typeof GrinderContract==='object'&&GrinderContract.message?GrinderContract.message(error):String(error?.message||error||'The save did not complete.');
      recover.innerHTML='<div class="card" role="alert"><p><b>Save not confirmed.</b> '+esc(message)+'</p><p>This page cannot tell whether the service received the run. Your draft and audience are kept. Check and try again looks for this exact save first, so it will open an existing run instead of posting a duplicate.</p><div class="cta"><button type="button" id="manual-retry">Check and try again</button><a class="act" href="/?mine">Your runs</a></div></div>';
      recover.hidden=false;
      $('manual-retry').onclick=()=>{recover.hidden=true;pb.click()};
      status('Save not confirmed. Your draft is still here.',true);
    };
    try{
      const prior=await existing();
      if(prior){await openExisting(prior);return}
    }catch(error){showRecovery(error);pb.disabled=false;return}
    const row={id:attemptId,profile_id:ME.id,title,project:$('f_project').value||null,repo_url:safeRepoUrl($('f_repo')?.value),model:$('f_model').value.trim()||null,trace_basis:'typed-by-author',
      segment_id:$('f_segment').value||null,wall_time_s:wallTime,
      harness:null,prompts:+$('f_prompts').value||null,duration_s:(+$('f_dur').value||0)*60||null,commits:+$('f_commits').value||null,
      caption,output_url:output||null,visibility:'private',started_at:new Date().toISOString()};
    // Segment columns (migration supabase/strava/001_segments.sql) are only sent when set,
    // so posting keeps working on a database that does not have them yet.
    dropNullSegmentColumns(row);
    let data,error;
    try{({data,error}=await sb.from('runs').insert(row).select('id').single())}catch(unexpected){error=unexpected}
    pb.disabled=false;
    if(error){
      if(error.code==='23505'){try{const prior=await existing();if(prior){await openExisting(prior);return}}catch(_){}}
      showRecovery(error);return;
    }
    let savedAudience='private';
    if(audience!=='private'){
      const {error:audienceError}=await sb.from('runs').update({visibility:audience}).eq('id',data.id).eq('profile_id',ME.id);
      if(audienceError){
        clearDraft();
        history.replaceState(null,'','/?run='+data.id);
        status('The run was saved for Only me, but the audience change failed. Choose the audience again from the run.',true);
        await viewRun(data.id);
        return;
      }
      savedAudience=audience;
    }
    clearDraft();
    history.replaceState(null,'','/?run='+data.id);fairConfirmRun(data.id);
    status(savedAudience==='private'?'Saved for Only me. Only you can see it.':savedAudience==='close_friends'?'Saved for Close friends. People on your list can read it.':savedAudience==='link'?'Saved for Followers. Signed-in followers and close friends can read it.':'Saved to Public feed and profile. Copy the public link or open the shared post.');
    viewRun(data.id);
  });
}

// TIME ON A RUN, one rule (25 Sep 2026): wall_time_s when the capture measured it, else

const runSeconds=r=>{const v=r.wall_time_s??r.duration_s;return Number.isFinite(v)&&v>0?v:0};

function weekStart(now=new Date()){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}

// THE HEATMAP. A GitHub contribution graph of the runs a viewer can see on a profile: one square
// a day for the last 52 weeks, darker for more runs that day. Days come from started_at, else
// created_at, in the reader's time zone. A square with no run is the page's rule colour.
function heatmapSvg(runs,now=new Date()){
  const counts=new Map();
  for(const r of runs){const t=runStart(r);if(!t)continue;const d=new Date(t);d.setHours(0,0,0,0);counts.set(d.getTime(),(counts.get(d.getTime())||0)+1)}
  const end=new Date(now);end.setHours(0,0,0,0);
  const start=new Date(end);start.setDate(end.getDate()-((end.getDay()+6)%7)-7*51);
  const cell=11,gap=2,cols=52,rows=7;
  const fill=n=>n>=3?'var(--blue)':n===2?'#6b96ff':n===1?'var(--blue-soft)':'var(--rule)';
  let out='';let total=0;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){const d=new Date(start);d.setDate(start.getDate()+c*7+r);if(d>end)continue;const n=counts.get(d.getTime())||0;total+=n;
    out+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${fill(n)}"><title>${d.toDateString()}: ${n} run${n===1?'':'s'}</title></rect>`}
  const w=cols*(cell+gap)-gap,h=rows*(cell+gap)-gap;
  return `<figure class="heatmap"><figcaption class="meta">${total} run${total===1?'':'s'} in the last 52 weeks</figcaption><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${total} runs in the last 52 weeks, one square per day">${out}</svg></figure>`;
}

// The publish payload survives the OAuth round trip in sessionStorage, because it cannot survive
// it in the URL. Written before the redirect, read back and put on the URL before route() looks
// at location.hash. route() runs twice after a redirect (refreshAuth, then onAuthStateChange);
// the hash is written before the stash is cleared, so the second pass still finds the payload.
const IMPORT_STASH='ag_import';
function stashImport(payload){ try{ sessionStorage.setItem(IMPORT_STASH,payload);return sessionStorage.getItem(IMPORT_STASH)===payload; }catch(_){return false;} }
function restoreImport(){
  let stash=null; try{ stash=sessionStorage.getItem(IMPORT_STASH); }catch(_){ return; }
  if(!stash) return;
  if(!/import=/.test(location.hash)) history.replaceState(null,'','/#import='+stash);
  try{ sessionStorage.removeItem(IMPORT_STASH); }catch(_){}
}

async function decodeImportPayload(payload){
  if(payload.startsWith('gz.')){
    if(typeof DecompressionStream!=='function'){
      const error=new Error('This compressed import needs a browser with built-in gzip support. Update the browser, or use the local card while keeping the selected session available.');
      error.importCompatibility=true;throw error;
    }
    const encoded=payload.slice(3).replace(/-/g,'+').replace(/_/g,'/');
    const padded=encoded+'='.repeat((4-encoded.length%4)%4);
    const bytes=Uint8Array.from(atob(padded),character=>character.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }
  return JSON.parse(atob(decodeURIComponent(payload)));
}

    history.replaceState(null,'','/?run='+published.id);fairConfirmRun(published.id);status((savedAudience==='private'?'Saved for Only me. Change the audience when you deliberately want to share.':savedAudience==='close_friends'?'Saved for Close friends. Copy its link for someone on your list.':savedAudience==='link'?'Saved for Followers. Signed-in followers and close friends can read it.':'Saved to Public feed and profile. Copy the public link or open the shared post.')+rigNote);
    await viewRun(published.id);
    }catch(unexpected){showRecovery(unexpected)}finally{publishButton.disabled=false;publishButton.removeAttribute('aria-busy');if(publishButton.isConnected)publishButton.textContent=saveLabel}

  });
  return true;
}

async function viewShareRun(id){
  const app=$('app'); frame(railHtml(null),null,true);
  const q=new URLSearchParams(location.search);
  const {data:r,error:runError}=await sb.from('runs').select('*, profiles!runs_profile_id_fkey(github_handle,name,rig,handle,display_name,avatar_url)').eq('id',id).single();
  if(runError&&runError.code!=='PGRST116'){app.innerHTML='<div class="empty">This run could not load. Please refresh to try again.</div>';return;}
  if(!r){ app.innerHTML='<div class="empty">Run not found or private.</div>'; return; }
  let moment=null;const mid=q.get('moment');
  if(/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(mid||'')){
    const result=await sb.from('grinder_run_moments').select('*').eq('id',mid).eq('run_id',r.id).single();
    if(result.error||!result.data){app.innerHTML='<p>This moment is private, removed or unavailable. <a href="/?run='+encodeURIComponent(r.id)+'">Return to the grind</a>.</p>';return;}
    moment=result.data;
  }
  GrinderSharing.mount({run:r,slot:app,status,moment});
}

// An event (migration 014): when, where, which club, who is going, and Join for a signed-in reader.
async function viewEvent(){
  const id=new URLSearchParams(location.search).get('event')||'';
  const app=$('app'); frame(railHtml(null),null);
  const none='<div class="card"><div class="empty"><h3>This event is not on __BRAND__</h3><p><a href="/">Go to the home page</a></p></div></div>';
  if(!/^[0-9a-f-]{36}$/i.test(id)){app.innerHTML=none;return}
  app.innerHTML=skeletonCard();
  const {data:e,error}=await sb.from('grinder_events').select('id,title,about,place,starts_at,crew_id,grinder_crews(id,name)').eq('id',id).maybeSingle();
  if(error||!e){app.innerHTML=none;return}
  const {data:people}=await sb.from('grinder_event_people').select('profile_id').eq('event_id',id);
  const going=(people||[]).length, mine=!!(ME&&(people||[]).some(x=>x.profile_id===ME.id));
  const d=new Date(e.starts_at), past=d.getTime()<=Date.now();
  document.title=e.title+' · __BRAND__';
  app.innerHTML=`<article class="event-page">
    <div class="ev ev-head"><span class="ev-date"><b>${d.getDate()}</b><small>${esc(d.toLocaleDateString('en-GB',{month:'short'}))}</small></span>
      <span class="ev-body"><h1 class="ev-t">${esc(e.title)}</h1><span class="ev-meta">${esc(d.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))}</span>
      ${e.place?`<span class="ev-meta">${esc(e.place)}</span>`:''}${e.grinder_crews?`<span class="ev-meta"><a href="/?crew=${esc(e.grinder_crews.id)}">${esc(e.grinder_crews.name)}</a></span>`:''}</span></div>
    ${e.about?`<p class="ev-about">${esc(e.about)}</p>`:''}
    <p class="ev-going" id="ev-going">${going} going</p>
    ${past?'<p class="home-none">This event has started or passed.</p>':`<button type="button" class="act primary" id="ev-join">${!ME?signInLabel()+' to join':mine?'Leave':'Join'}</button>`}
  </article>`;
  const btn=$('ev-join'); if(!btn) return;
  btn.onclick=async()=>{
    if(!ME){showSignIn({reason:'social'});return}
    btn.disabled=true;btn.setAttribute('aria-busy','true');
    const {error:err}=await sb.rpc(mine?'grinder_leave_event':'grinder_join_event',{event:id});
    btn.removeAttribute('aria-busy');
    if(err){btn.disabled=false;status(err.message,true);return}
    await viewEvent();
  };
}


const forum=GrinderForum({client:sb,app:()=>document.getElementById('app'),frame,status});

// One title per page, in the same order route() checks the query, so the title names the page that opens.
const PAGE_TITLES=[['example','Example'],['boards','Leaderboard'],['projects','Projects'],['project','Project'],['segment','Segment'],['post','Add a run'],['mine','My runs'],['people','Find people'],['account','Settings'],['feedback','Send feedback'],['connect','Connections'],['following','Following'],['inbox','Notifications'],['crews','Clubs'],['crew','Club'],['join','Join a club'],['agents','Agents'],['agent','Agent']];
function pageTitle(q){
  const t=x=>x+' · __BRAND__';
  // Retired sections and legacy ?event= links are sent to Discover.
  if(RETIRED.some(k=>q.has(k))) return t('Discover');
  const hit=PAGE_TITLES.find(([k])=>q.has(k));
  if(hit) return t(hit[1]);
  if(q.get('event')) return t('Event');
  if(q.get('share')!==null&&(q.get('rig')||q.get('u')||q.get('run'))) return t('Share');
  if(q.get('run')) return t('Run');
  if(q.get('u')) return t('@'+q.get('u'));
  if(q.get('explore')!==null) return t('Discover');
  if(q.has('onboard')) return t('Connect your agent');
  return '__BRAND__ · __TAGLINE__';
}
async function route(){ RUN_VIEW_GENERATION++;window.StriveRunPhotos?.disposeAll?.();account.recover(); try{document.title=pageTitle(new URLSearchParams(location.search))}catch(_){}
  if(ME && social.refreshUnread) social.refreshUnread();
  if(IDENTITY_SETUP)return viewIdentitySetup();
  restoreImport();
  if(await importRun()) return;
  if(social&&typeof social.applyStoredSocialReturn==='function'){social.applyStoredSocialReturn();}else if(ME){try{const pending=sessionStorage.getItem('ag_social_return');if(pending&&/^\?(post|mine|following|inbox|run|u|example|people|account|connect|explore|boards|projects?|crews?)(=|&|$)/.test(pending)){history.replaceState(null,'','/'+pending);sessionStorage.removeItem('ag_social_return');}}catch(_){}}
  const q=new URLSearchParams(location.search);
  if(q.has('example')){
    if(q.get('example')==='share') return GrinderExample.viewShare();
    if(q.get('example')==='tree') return GrinderExample.viewTree();
    return GrinderExample.view();
  }
  if(RETIRED.some(k=>q.has(k))){history.replaceState(null,'','/?explore');status('That section is gone. What is left: runs, people and cheers.');return viewExplore();}
  if(q.has('boards'))return viewBoards();
  if(q.has('projects'))return viewProjects();
  if(q.has('project'))return viewProject(q.get('project'));
  if(q.has('segment'))return GrinderSegments.mount({client:sb,id:q.get('segment'),slot:$('app'),frame,status});
  if(q.has('post'))return viewPost();
  if(q.has('mine')){setPrimarySection('mine');return progress.history();}
  if(q.has('people')){setPrimarySection('discover');return people.discover(q.get('q')||'');}
  if(q.has('account')){return account.view();}
  if(q.has('feedback')){return viewFeedback();}
  if(q.has('connect')){if(q.get('connect')==='auto'){if(connect)return connect.view();return account.view();}return viewConnect();}
  if(q.has('following')){setPrimarySection('feed');return social.following();}
  if(q.has('inbox')){setPrimarySection('inbox');return social.inbox();}
  // Crews stay reachable by address for the one two-person crew PRODUCT.md names; not in any menu.
  if(q.has('crews')){setPrimarySection('community');return social.crews();}
  if(q.has('crew')){setPrimarySection('community');return social.crew(q.get('crew'));}
  if(q.has('join')){setPrimarySection('community');return social.join(q.get('join'));}
  if(q.has('agents')){setPrimarySection('mine');return social.agents();}
  if(q.has('agent')){setPrimarySection('mine');return social.agentProfile(q.get('agent'));}
  if(q.get('event')) return viewEvent();
  if(q.get('share')!==null){
    if(q.get('rig')) return viewShareRig(q.get('rig'));
    const u=q.get('u'); if(u) return viewShareProfile(u);
    const rn=q.get('run'); if(rn) return viewShareRun(rn);
  }
  const u=q.get('u'); const rn=q.get('run');
  if(rn) return viewRun(rn); if(u) return viewProfile(u); if(q.get('explore')!==null) return viewExplore();
  // The /l/ ask ("Drop yours") lands on the drop zone, signed in or not.
  if(location.hash==='#drop-zone') return viewPost();
  if(await shouldOnboard()) return viewOnboard();
  // Home is the feed (Oscar, 25 Sep 2026 evening). Signed in: the runs of the people you follow,
  // with people to follow and the latest public runs when that is empty. Signed out: the public
  // feed and the ask to sign in and build a profile. Adding a run is /?post.
  if(ME) return social.following({home:true});
  return viewLanding(); }

document.addEventListener('DOMContentLoaded',()=>{
  $('app').innerHTML=skeletonCard();
  syncAuthNav();
  // The avatar menu is the only dropdown. Product destinations live in the rail.
  const menus=[...document.querySelectorAll('details.account-menu')];
  menus.forEach(m=>m.addEventListener('toggle',()=>{ if(m.open) menus.forEach(o=>{ if(o!==m) o.open=false; }); }));
  document.addEventListener('click',e=>{ menus.forEach(m=>{ if(m.open && !m.contains(e.target)) m.open=false; }); });
  document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; menus.forEach(m=>{ if(m.open){ m.open=false; m.querySelector('summary')?.focus(); } }); });
  const drawer=$('notifications-drawer'), scrim=$('notifications-scrim'), noticeToggle=$('notifications-toggle');
  const closeNotifications=()=>{if(!drawer)return;drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');drawer.setAttribute('inert','');noticeToggle?.setAttribute('aria-expanded','false');if(scrim){scrim.classList.remove('open');setTimeout(()=>{if(!scrim.classList.contains('open'))scrim.hidden=true},210)}};
  const openNotifications=async()=>{if(!drawer)return;drawer.removeAttribute('inert');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');noticeToggle?.setAttribute('aria-expanded','true');if(scrim){scrim.hidden=false;requestAnimationFrame(()=>scrim.classList.add('open'))}await social.notificationsPanel?.($('notifications-body'));$('notifications-close')?.focus({preventScroll:true})};
  noticeToggle?.addEventListener('click',()=>drawer?.classList.contains('open')?closeNotifications():openNotifications());
  $('notifications-close')?.addEventListener('click',closeNotifications);scrim?.addEventListener('click',closeNotifications);
  $('notifications-read-all')?.addEventListener('click',async()=>{await social.markAllNotificationsRead?.();await social.notificationsPanel?.($('notifications-body'))});
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-signin]')){ e.preventDefault(); menus.forEach(m=>m.open=false); showSignIn(); return; }
    if(e.target.closest('[data-signout]')){ e.preventDefault(); auth.signOutLocal().then(()=>location.href='/').catch(err=>status(err.detail?.message||'Sign-out failed. Try again.',true)); }
    if(drawer?.classList.contains('open')&&e.target.closest('[data-notification-open]')) closeNotifications();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer?.classList.contains('open')){closeNotifications();noticeToggle?.focus()}});
  $('auth').addEventListener('click',async()=>{ if(!sb){status('Refresh.',true);return;}
    showSignIn(); });
  if(sb){
    // Initial session loading and SIGNED_IN can arrive together. Finish one render
    // before another auth refresh can append controls to the same page.
    let authRefresh=Promise.resolve();
    const refreshAndRoute=()=>{authRefresh=authRefresh.catch(()=>{}).then(async()=>{const generation=AUTH_GENERATION;await refreshAuth();if(generation===AUTH_GENERATION)await route()});return authRefresh;};
    loadProviders().then(refreshAndRoute,refreshAndRoute);
    sb.auth.onAuthStateChange((event,session)=>handleAuthStateChange(event,session,refreshAndRoute));
  } else route();
});
</script>
