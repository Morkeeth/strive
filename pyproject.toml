[project]
name = "agentgrinder"
version = "0.1.0"
description = "Agent Grinder — free social run cards for people building with coding agents."
readme = "README.md"
requires-python = ">=3.9"      # measured, not assumed: every command runs under macOS system python 3.9.6
license = {text = "MIT"}
authors = [{name = "Oscar Morke"}]

[project.optional-dependencies]
# the grind coach runs on the Strands Agents SDK, which needs Python 3.10 or newer. The base
# install stays dependency-free and 3.9-clean; `coach` and `grind --coach` say so when it is missing.
coach = ["strands-agents>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
agentgrinder = "agentgrinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# every subpackage, named. `packages = ["agentgrinder"]` alone shipped a wheel with no
# agentgrinder.coach and no agentgrinder.engine in it: `pip install .` then answered `agentgrinder
# coach` with "the coach needs the Strands SDK" while the SDK was installed. Caught by a stranger
# pass on a fresh clone, 3 Sep 2026.
packages = ["agentgrinder", "agentgrinder.coach", "agentgrinder.engine"]

[tool.setuptools.package-data]
agentgrinder = ["data/*.json", "assets/*.js"]
